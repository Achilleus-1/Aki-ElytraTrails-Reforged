plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_archive_name}-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}
sourceSets.main {
    java.srcDir 'src/client/java'
    resources.srcDir 'src/client/resources'
}
repositories {
    maven { url = 'https://maven.shedaniel.me/' }
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}
jar {
    from('LICENSE')
    manifest.attributes(
        'Implementation-Title': mod_name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'Achilleus (Achilleus-1)',
        'Built-On-Minecraft': minecraft_version
    )
}

// Keep packaged mod metadata in sync with gradle.properties.
def modProperties = [
    'minecraft_version_range', 'neo_version_range', 'loader_version_range',
    'mod_id', 'mod_name', 'mod_version', 'mod_license', 'mod_authors'
].collectEntries { name -> [(name): project.property(name)] }

tasks.named('processResources', ProcessResources) {
    inputs.properties(modProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modProperties)
    }
}
